[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "netbox-example-plugin"
version = "0.1.0"
description = "Example custom NetBox plugin, developed and run in Docker."
readme = "README.md"
requires-python = ">=3.12.0"

[tool.setuptools.packages.find]
where = ["."]
include = ["netbox_example_plugin*"]

[tool.setuptools.package-data]
netbox_example_plugin = ["templates/**"]
